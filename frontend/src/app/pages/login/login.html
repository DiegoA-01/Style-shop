<div class="auth">
  <div class="auth-art glass" aria-hidden="true">
    <app-silk-ribbon class="auth-silk" [pose]="1" />
    <span class="auth-sheen"></span>
  </div>

  <section class="auth-card glass" aria-labelledby="auth-title">
    <h2 id="auth-title" class="display">Inicia sesión</h2>

    <nav class="auth-switch glass" aria-label="Elegir">
      <span class="auth-thumb" aria-hidden="true"></span>
      <a routerLink="/login" class="on" aria-current="page">Entrar</a>
      <a routerLink="/register">Crear cuenta</a>
    </nav>

    @if (error()) {
      <p class="auth-error" role="alert">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="ingresar()" class="auth-form" novalidate>
      <div class="float-field">
        <input id="login-user" type="text" formControlName="username" autocomplete="username" placeholder=" ">
        <label for="login-user">Usuario</label>
      </div>

      <div class="float-field">
        <input id="login-pass" [type]="verPass() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder=" ">
        <label for="login-pass">Contraseña</label>
        <button type="button" class="peek" [attr.aria-label]="verPass() ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="verPass.set(!verPass())">
          @if (verPass()) {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18" /><path d="M10.6 6.2A9.7 9.7 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-3 3.4M6.4 7.6C4.2 9.1 3 12 3 12s4 6 9 6a8.7 8.7 0 0 0 4.4-1.2" /><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" /></svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6Z" /><circle cx="12" cy="12" r="3" /></svg>
          }
        </button>
      </div>

      <button type="submit" class="btn" appMagnet [disabled]="form.invalid || cargando()">
        @if (cargando()) {
          <span class="spinner" aria-hidden="true"></span> Entrando
        } @else {
          Entrar
        }
      </button>
    </form>
  </section>
</div>
