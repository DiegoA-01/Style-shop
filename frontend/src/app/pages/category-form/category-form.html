<div class="form-shell" [class.standalone]="!embedded()">
  @if (!embedded()) {
    <header class="form-head">
      <p class="mono-label">Personal</p>
      <h2 class="display">{{ id() ? 'Editar categoría' : 'Nueva categoría' }}</h2>
    </header>
  }

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" class="lux-form">
    <label>
      Nombre
      <input type="text" formControlName="name">
    </label>
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <small class="error">El nombre necesita al menos 2 letras.</small>
    }

    <label>
      Descripción
      <textarea formControlName="description" rows="2"></textarea>
    </label>

    <div class="form-actions">
      @if (embedded()) {
        <button type="button" class="btn-line" (click)="cerrar()">Cancelar</button>
      } @else {
        <a class="btn-line" routerLink="/categories">Cancelar</a>
      }
      <button type="submit" class="btn" [disabled]="form.invalid || guardando()">
        @if (guardando()) {
          <span class="spinner" aria-hidden="true"></span> Guardando
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
